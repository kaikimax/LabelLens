# Runs everything: the database and the app.
#   docker compose up --build      → http://localhost:8080   (Ctrl+C to stop)
#   docker compose down            → stop and remove the containers (add -v to also delete the data)
#
# For development with "mvn -pl app spring-boot:run", start only the database:
#   docker compose up -d postgres
#
# The Azure endpoint and key are read from .env (never committed; see .env.example).
# Without .env the app still starts; reading a photo then fails with a clear message.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: labellens
      POSTGRES_USER: labellens
      POSTGRES_PASSWORD: labellens   # local-only password; Azure uses its own
    ports:
      # 5433 on your PC → 5432 inside the container.
      # Not 5432 on the PC side, because a locally installed PostgreSQL may already use it.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labellens -d labellens"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Inside Docker the database is reached by its service name, on its own port.
      DB_URL: jdbc:postgresql://postgres:5432/labellens
      DB_USER: labellens
      DB_PASSWORD: labellens
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy   # wait until it accepts connections, not just until it started
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads: