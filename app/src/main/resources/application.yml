spring:
  application:
    name: labellens

  # Reads secrets from a local .env file (never committed; see .env.example).
  # Two locations because "mvn -pl app spring-boot:run" runs from the app/ folder.
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"

  # The AI model. Values come from environment variables or .env, never from this file.
  # The defaults let the app and the tests start without them; a real call then fails
  # with a clear error mentioning the missing variable.
  ai:
    openai:
      # base-url: ${AZURE_OPENAI_ENDPOINT:https://set-AZURE_OPENAI_ENDPOINT.invalid}
      base-url: ${AZURE_OPENAI_ENDPOINT:https://azure-endpoint-not-set.invalid}
      api-key: ${AZURE_OPENAI_API_KEY:missing-AZURE_OPENAI_API_KEY}
      max-retries: 1
      timeout: 60s
      chat:
        # On Azure, this is the deployment name.
        model: ${LABELLENS_READER_DEPLOYMENT:gpt-4.1-mini}
        # 0 = as repeatable as possible: we want the same photo read the same way every time.
        temperature: 0.0

  # Values like ${DB_URL:...} read an environment variable, or use the default after ":".
  # The defaults match compose.yaml, so locally you don't set anything.
  # On Azure, the real values come from environment variables (never written in this file).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/labellens}
    username: ${DB_USER:labellens}
    password: ${DB_PASSWORD:labellens}

  jpa:
    # Don't keep database sessions open while writing the HTTP response.
    # Forces us to load everything we need inside the service. A common best practice.
    open-in-view: false
    hibernate:
      # Flyway creates the tables. Hibernate only checks that the Java classes match them,
      # and refuses to start if they don't.
      ddl-auto: validate

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 31MB

  mvc:
    problemdetails:
      enabled: true

labellens:
  storage:
    local-dir: ${PHOTO_DIR:./uploads}
